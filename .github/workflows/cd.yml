name: Continuous Delivery & Cloud Deployment (CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:${{ github.sha }}

      # Build and push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest,${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:${{ github.sha }}

  deploy-to-cloud-run:
    name: Deploy Services to Google Cloud Run
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Deploy Backend to Google Cloud Run
      - name: Deploy Backend to Google Cloud Run
        run: |
          gcloud run deploy mern-blog-backend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --platform managed \
            --allow-unauthenticated \
            --port 5000 \
            --set-env-vars MONGO_URI="${{ secrets.MONGO_URI }}",NODE_ENV="production"

      # Deploy Frontend to Google Cloud Run
      - name: Deploy Frontend to Google Cloud Run
        run: |
          gcloud run deploy mern-blog-frontend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --platform managed \
            --allow-unauthenticated \
            --port 80
